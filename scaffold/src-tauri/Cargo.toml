[package]
name = "kinexa"
version = "0.1.0"
description = "Kinexa · 二维动画与矢量动画软件（小方工作室）"
authors = ["小方工作室"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kinexa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
incremental = false
